version: 2
updates:
  # Python deps (uv.lock is read via Dependabot's pip ecosystem).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # GitHub Actions used in workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image in the backend Dockerfile.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
